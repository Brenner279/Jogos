<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Máscara por Gestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bibliotecas do MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-sizing: border-box;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ff3366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Efeito de Flash na mudança de máscara */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Vídeo escondido para processamento -->
        <video id="input_video" class="hidden" autoplay playsinline></video>
        
        <!-- Canvas principal de renderização -->
        <canvas id="output_canvas"></canvas>
        
        <!-- Camada de Flash para transições -->
        <div id="flash-overlay"></div>

        <!-- Interface do Utilizador -->
        <div class="ui-layer">
            <div class="flex justify-between w-full">
                <div class="glass-panel px-6 py-3">
                    <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-[#ff3366] to-[#ff9933]">FILTRO DINÂMICO</h1>
                    <p class="text-xs text-gray-400 mt-1" id="status-text">A detetar rosto e mãos...</p>
                </div>

                <div class="glass-panel px-4 py-3 text-right max-w-[250px]">
                    <div class="text-sm font-bold mb-1 text-white">COMO USAR</div>
                    <div class="text-xs text-gray-300">Levante a mão. <br><b>Abra e feche a mão</b> (punho cerrado) para alterar a máscara holográfica.</div>
                </div>
            </div>

            <!-- Ecrã de Carregamento -->
            <div id="loading" class="glass-panel p-8">
                <div class="spinner"></div>
                <div class="text-sm font-bold tracking-widest text-[#ff3366]">A INICIAR MOTOR DE IA...</div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÕES E ESTADO ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        const flashOverlay = document.getElementById('flash-overlay');

        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;

        // Lista de "Máscaras" (Emojis) que vão rodar
        const MASKS = ['👹', '✨', '👺', '🔥', '🤡', '🌪️', '👽', '💥'];
        let currentMaskIndex = 0;

        // Lógica de Gestos
        let gestureBuffer = [];
        let currentHandState = 'NONE'; // 'OPEN', 'CLOSED', 'NONE'
        
        // Interpolação suave para o movimento da máscara
        let smoothFace = { x: 0, y: 0, size: 0, angle: 0 };
        let firstFaceDetected = true;

        // --- AJUSTE DE REDIMENSIONAMENTO ---
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            canvasWidth = canvasElement.width;
            canvasHeight = canvasElement.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- UTILIDADES ---

        // Função para disparar um flash visual quando a máscara muda
        function triggerFlash() {
            flashOverlay.style.transition = 'none';
            flashOverlay.style.opacity = '0.8';
            
            // Forçar o reflow
            void flashOverlay.offsetWidth;
            
            flashOverlay.style.transition = 'opacity 0.5s ease-out';
            flashOverlay.style.opacity = '0';
        }

        // Verifica se a mão está aberta (dedos esticados) ou fechada (punho)
        function isHandOpen(landmarks) {
            if (!landmarks) return false;
            
            let openFingers = 0;
            const wrist = landmarks[0];
            
            // Pontas e articulações da base (MCP) para os 4 dedos principais
            const fingers = [
                { tip: 8, mcp: 5 },   // Indicador
                { tip: 12, mcp: 9 },  // Médio
                { tip: 16, mcp: 13 }, // Anelar
                { tip: 20, mcp: 17 }  // Mínimo
            ];
            
            fingers.forEach(f => {
                const tip = landmarks[f.tip];
                const mcp = landmarks[f.mcp];
                
                // Distância 3D simples
                const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y, mcp.z - wrist.z);
                
                // Se a ponta estiver visivelmente mais longe do pulso que a base do dedo, está esticado
                if (tipDist > mcpDist * 1.2) {
                    openFingers++;
                }
            });
            
            // Se pelo menos 2-3 dedos estiverem esticados, consideramos a mão aberta
            return openFingers >= 2;
        }

        // Desenha a estrutura da mão invertida (efeito espelho)
        function drawFlippedHand(ctx, landmarks, connections) {
            const flipped = landmarks.map(lm => ({
                x: 1 - lm.x, // Inverter eixo X
                y: lm.y,
                z: lm.z
            }));
            
            if (connections) {
                drawConnectors(ctx, flipped, connections, {color: 'rgba(255, 51, 102, 0.4)', lineWidth: 3});
            }
            drawLandmarks(ctx, flipped, {color: '#ffffff', lineWidth: 1, radius: 2});
        }

        // --- LÓGICA PRINCIPAL (ON RESULTS) ---
        function onResults(results) {
            // Esconder ecrã de carregamento na primeira frame válida
            if (loadingEl.style.display !== 'none') {
                loadingEl.style.display = 'none';
                statusText.innerText = 'Pronto! Mostre a sua mão.';
            }

            canvasCtx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 1. Desenhar o Vídeo de Fundo (Espelhado)
            canvasCtx.save();
            canvasCtx.translate(canvasWidth, 0);
            canvasCtx.scale(-1, 1);
            if (results.image) {
                // Cálculo para cobrir todo o ecrã (object-fit: cover)
                const vRatio = canvasWidth / canvasHeight;
                const iRatio = results.image.width / results.image.height;
                let dx, dy, dw, dh;
                if (vRatio > iRatio) {
                    dw = canvasWidth;
                    dh = canvasWidth / iRatio;
                    dx = 0;
                    dy = (canvasHeight - dh) / 2;
                } else {
                    dw = canvasHeight * iRatio;
                    dh = canvasHeight;
                    dx = (canvasWidth - dw) / 2;
                    dy = 0;
                }
                canvasCtx.drawImage(results.image, dx, dy, dw, dh);
            }
            canvasCtx.restore();

            // 2. Lógica de Deteção da Mão
            // O modelo Holistic fornece 'leftHandLandmarks' e 'rightHandLandmarks'.
            // Como a imagem está espelhada fisicamente, a mão direita real aparece como a 'leftHand' no ecrã.
            const handLandmarks = results.leftHandLandmarks || results.rightHandLandmarks;
            
            if (handLandmarks) {
                const isOpen = isHandOpen(handLandmarks);
                
                // Sistema de "Debounce": Evita mudanças bruscas garantindo X frames consecutivas
                gestureBuffer.push(isOpen);
                if (gestureBuffer.length > 5) gestureBuffer.shift(); // Manter buffer pequeno
                
                let detectedState = currentHandState;
                if (gestureBuffer.every(val => val === true)) detectedState = 'OPEN';
                else if (gestureBuffer.every(val => val === false)) detectedState = 'CLOSED';

                // Se o estado estabilizado for diferente do anterior, mudamos a máscara!
                if (currentHandState !== 'NONE' && detectedState !== currentHandState) {
                    currentMaskIndex = (currentMaskIndex + 1) % MASKS.length;
                    triggerFlash();
                    statusText.innerText = detectedState === 'OPEN' ? 'Mão Aberta!' : 'Punho Cerrado!';
                }
                
                currentHandState = detectedState;

                // Desenhar a mão detetada
                drawFlippedHand(canvasCtx, handLandmarks, HAND_CONNECTIONS);
            } else {
                // Esvaziar buffer se a mão sair do ecrã para evitar comportamentos estranhos no retorno
                gestureBuffer = []; 
                if (currentHandState !== 'NONE') {
                    statusText.innerText = 'Rastreamento de Rosto Ativo';
                }
            }

            // 3. Renderização da Máscara (Rosto)
            if (results.faceLandmarks) {
                const face = results.faceLandmarks;
                
                // Extrair pontos chave para calcular tamanho e rotação
                const nose = face[1];
                const leftCheek = face[234]; // Lado esquerdo do utilizador
                const rightCheek = face[454]; // Lado direito do utilizador
                const leftEye = face[33];
                const rightEye = face[263];

                // Converter para coordenadas de ecrã (Inversão X manual devido ao efeito espelho)
                const cx = (1 - nose.x) * canvasWidth;
                const cy = nose.y * canvasHeight;

                const lx = (1 - leftCheek.x) * canvasWidth;
                const rx = (1 - rightCheek.x) * canvasWidth;
                const faceWidth = Math.abs(lx - rx) * 2; // Multiplicador para a máscara cobrir bem a cabeça

                const lex = (1 - leftEye.x) * canvasWidth;
                const ley = leftEye.y * canvasHeight;
                const rex = (1 - rightEye.x) * canvasWidth;
                const rey = rightEye.y * canvasHeight;
                
                const angle = Math.atan2(rey - ley, rex - lex);

                // Interpolação suave (Lerp) para evitar trepidação
                if (firstFaceDetected) {
                    smoothFace = { x: cx, y: cy, size: faceWidth, angle: angle };
                    firstFaceDetected = false;
                } else {
                    smoothFace.x += (cx - smoothFace.x) * 0.4;
                    smoothFace.y += (cy - smoothFace.y) * 0.4;
                    smoothFace.size += (faceWidth - smoothFace.size) * 0.3;
                    smoothFace.angle += (angle - smoothFace.angle) * 0.3;
                }

                // Desenhar a Máscara Atual
                canvasCtx.save();
                canvasCtx.translate(smoothFace.x, smoothFace.y);
                canvasCtx.rotate(smoothFace.angle);
                
                canvasCtx.font = `${smoothFace.size}px Arial`;
                canvasCtx.textAlign = 'center';
                canvasCtx.textBaseline = 'middle';
                
                // Aplicar ligeira sombra para destacar a máscara do vídeo
                canvasCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                canvasCtx.shadowBlur = 20;
                
                // Desenhar Emoji (ajustando a posição Y para ficar bem centrado na cara)
                canvasCtx.fillText(MASKS[currentMaskIndex], 0, -smoothFace.size * 0.1);
                
                canvasCtx.restore();
            } else {
                firstFaceDetected = true; // Reiniciar interpolação se o rosto for perdido
            }
        }

        // --- INICIALIZAÇÃO DO MEDIAPIPE HOLISTIC ---
        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});
        
        holistic.setOptions({
            modelComplexity: 1,      // 0, 1 ou 2. 1 oferece bom balanço entre rapidez e precisão
            smoothLandmarks: true,
            enableSegmentation: false, // Desativado para melhor performance
            refineFaceLandmarks: true, // Crucial para rotação ocular e rosto estável
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        holistic.onResults(onResults);

        // --- INICIALIZAÇÃO DA CÂMARA ---
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await holistic.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        
        camera.start();

    </script>
</body>
</html>

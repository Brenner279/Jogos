<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle ao Vivo com MediaPipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #111;
            color: #ccff00; /* Neon Green */
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .neon-text {
            text-shadow: 0 0 5px rgba(204, 255, 0, 0.5);
        }
        
        .neon-box {
            border: 2px solid #ccff00;
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.3), inset 0 0 10px rgba(204, 255, 0, 0.3);
            background-color: rgba(17, 17, 17, 0.8);
        }

        #complete-screen {
            display: none;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Hidden video element for MediaPipe input -->
        <video id="input_video" class="hidden" autoplay playsinline></video>
        
        <!-- Main rendering canvas -->
        <canvas id="output_canvas"></canvas>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <!-- Header -->
            <div class="flex justify-between items-start w-full">
                <div class="flex flex-col items-center w-full absolute top-8 left-0">
                    <h1 class="text-3xl font-bold tracking-widest neon-text">PUZZLE AO VIVO</h1>
                    <p class="text-sm opacity-80 mt-1">Enquadre para Capturar. Junte os dedos e arraste para trocar.</p>
                </div>
                
                <!-- Status/Instructions Right -->
                <div class="absolute top-8 right-8 neon-box p-3 text-xs text-right max-w-xs">
                    <div class="font-bold mb-1">INSTRUÇÕES</div>
                    <div class="text-white/80">1. Junte o indicador e polegar para agarrar uma peça.</div>
                    <div class="text-white/80">2. Arraste e solte sobre outra para trocar.</div>
                </div>
            </div>

            <!-- Timer (Visible during play) -->
            <div id="timer-display" class="absolute top-24 left-1/2 transform -translate-x-1/2 text-2xl font-bold bg-black/50 px-4 py-1 rounded hidden neon-box">
                ⏱ 0:00
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-xl animate-pulse">
                A iniciar a câmara e IA...
            </div>
        </div>

        <!-- Complete Screen -->
        <div id="complete-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
            <div class="neon-box p-8 flex flex-col items-center text-center max-w-md w-full">
                <div class="text-6xl mb-4">🏆</div>
                <h2 class="text-4xl font-bold mb-2 neon-text">CONCLUÍDO!</h2>
                <div id="final-time" class="text-2xl text-white mb-6">⏱ 0:00</div>
                
                <p class="text-sm text-gray-400 mb-2">Introduza o seu nome para a tabela de classificação</p>
                <input type="text" id="player-name" placeholder="O SEU NOME" class="w-full bg-transparent border-b-2 border-[#ccff00] text-center text-xl p-2 mb-6 text-white outline-none focus:bg-white/5 transition-colors" maxlength="15">
                
                <button onclick="resetGame()" class="bg-[#ccff00] text-black font-bold py-3 px-6 hover:bg-white transition-colors w-full flex items-center justify-center gap-2">
                    JOGAR NOVAMENTE <span class="text-xl">➔</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME CONSTANTS & STATE ---
        const GAME_STATE = {
            LOADING: 0,
            INIT: 1,      // Waiting for capture
            PLAYING: 2,   // Solving puzzle
            COMPLETE: 3   // Won
        };

        const GRID_SIZE = 3;
        const PUZZLE_SIZE = Math.min(window.innerWidth * 0.8, window.innerHeight * 0.8, 600); // Responsive size, max 600
        const TILE_SIZE = PUZZLE_SIZE / GRID_SIZE;
        const PINCH_THRESHOLD = 0.05; // Distance between thumb and index finger tip

        let state = GAME_STATE.LOADING;
        let tiles = [];
        let startTime = 0;
        let timerInterval;
        let canvasWidth = 0;
        let canvasHeight = 0;
        let puzzleStartX = 0;
        let puzzleStartY = 0;
        
        // Interaction State
        let isPinching = false;
        let grabbedTile = null;
        let pinchCursor = { x: 0, y: 0 };
        let grabOffset = { x: 0, y: 0 };
        
        // DOM Elements
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingEl = document.getElementById('loading');
        const timerEl = document.getElementById('timer-display');
        const completeScreen = document.getElementById('complete-screen');
        const finalTimeEl = document.getElementById('final-time');

        // --- RESIZE HANDLER ---
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            canvasWidth = canvasElement.width;
            canvasHeight = canvasElement.height;
            
            puzzleStartX = (canvasWidth - PUZZLE_SIZE) / 2;
            puzzleStartY = (canvasHeight - PUZZLE_SIZE) / 2;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- TILE CLASS ---
        class Tile {
            constructor(id, row, col, imageCanvas) {
                this.id = id;
                this.correctRow = row;
                this.correctCol = col;
                this.currentRow = row;
                this.currentCol = col;
                this.image = imageCanvas;
                
                // For animation/dragging
                this.x = puzzleStartX + col * TILE_SIZE;
                this.y = puzzleStartY + row * TILE_SIZE;
            }

            updatePosition() {
                if (this !== grabbedTile) {
                    // Snap to current grid position
                    const targetX = puzzleStartX + this.currentCol * TILE_SIZE;
                    const targetY = puzzleStartY + this.currentRow * TILE_SIZE;
                    // Simple easing
                    this.x += (targetX - this.x) * 0.2;
                    this.y += (targetY - this.y) * 0.2;
                }
            }

            draw(ctx) {
                // Draw image
                ctx.drawImage(this.image, this.x, this.y, TILE_SIZE, TILE_SIZE);
                
                // Draw border
                ctx.strokeStyle = this === grabbedTile ? '#ccff00' : 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = this === grabbedTile ? 4 : 1;
                ctx.strokeRect(this.x, this.y, TILE_SIZE, TILE_SIZE);

                if (this === grabbedTile) {
                    ctx.fillStyle = 'rgba(204, 255, 0, 0.1)';
                    ctx.fillRect(this.x, this.y, TILE_SIZE, TILE_SIZE);
                }
            }

            isCorrect() {
                return this.currentRow === this.correctRow && this.currentCol === this.correctCol;
            }
        }

        // --- GAME LOGIC ---

        function captureAndScramble() {
            tiles = [];
            // Create tiles
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    // Create an offscreen canvas for each tile piece
                    const tileCanvas = document.createElement('canvas');
                    tileCanvas.width = TILE_SIZE;
                    tileCanvas.height = TILE_SIZE;
                    const tCtx = tileCanvas.getContext('2d');
                    
                    // The video is drawn mirrored and scaled on the main canvas. 
                    // To get exactly what the user sees, we copy from the main canvas itself.
                    tCtx.drawImage(
                        canvasElement, 
                        puzzleStartX + col * TILE_SIZE, 
                        puzzleStartY + row * TILE_SIZE, 
                        TILE_SIZE, TILE_SIZE,
                        0, 0, TILE_SIZE, TILE_SIZE
                    );
                    
                    tiles.push(new Tile(row * GRID_SIZE + col, row, col, tileCanvas));
                }
            }

            // Shuffle positions
            let positions = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    positions.push({r, c});
                }
            }
            
            // Fisher-Yates shuffle
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }

            // Assign shuffled positions
            tiles.forEach((tile, index) => {
                tile.currentRow = positions[index].r;
                tile.currentCol = positions[index].c;
                // Instantly move to new positions for the start
                tile.x = puzzleStartX + tile.currentCol * TILE_SIZE;
                tile.y = puzzleStartY + tile.currentRow * TILE_SIZE;
            });

            // Start Game
            state = GAME_STATE.PLAYING;
            startTime = Date.now();
            timerEl.classList.remove('hidden');
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = (elapsed % 60).toString().padStart(2, '0');
            const timeStr = `⏱ ${mins}:${secs}`;
            timerEl.innerText = timeStr;
            return timeStr;
        }

        function checkWin() {
            const won = tiles.every(tile => tile.isCorrect());
            if (won) {
                state = GAME_STATE.COMPLETE;
                clearInterval(timerInterval);
                timerEl.classList.add('hidden');
                completeScreen.style.display = 'flex';
                finalTimeEl.innerText = updateTimer();
            }
        }

        function resetGame() {
            state = GAME_STATE.INIT;
            completeScreen.style.display = 'none';
            tiles = [];
            isPinching = false;
            grabbedTile = null;
        }

        // --- MEDIAPIPE CALLBACK ---
        function onResults(results) {
            if (state === GAME_STATE.LOADING) {
                state = GAME_STATE.INIT;
                loadingEl.style.display = 'none';
            }

            // 1. Draw Video Background (Mirrored)
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            canvasCtx.translate(canvasWidth, 0);
            canvasCtx.scale(-1, 1);
            if (results.image) {
                // Draw video covering the entire canvas
                const vRatio = canvasWidth / canvasHeight;
                const iRatio = results.image.width / results.image.height;
                let dx, dy, dw, dh;
                if (vRatio > iRatio) {
                    dw = canvasWidth;
                    dh = canvasWidth / iRatio;
                    dx = 0;
                    dy = (canvasHeight - dh) / 2;
                } else {
                    dw = canvasHeight * iRatio;
                    dh = canvasHeight;
                    dx = (canvasWidth - dw) / 2;
                    dy = 0;
                }
                
                // Darken video slightly in playing mode
                canvasCtx.globalAlpha = state === GAME_STATE.PLAYING ? 0.4 : 1.0;
                canvasCtx.drawImage(results.image, dx, dy, dw, dh);
                canvasCtx.globalAlpha = 1.0;
            }
            canvasCtx.restore();

            // 2. Hand Tracking Logic
            let handDetected = false;
            let currentPinch = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const landmarks = results.multiHandLandmarks[0]; // Use first hand
                
                // X is flipped because we mirror the video display visually
                const thumbTip = { x: (1 - landmarks[4].x) * canvasWidth, y: landmarks[4].y * canvasHeight };
                const indexTip = { x: (1 - landmarks[8].x) * canvasWidth, y: landmarks[8].y * canvasHeight };
                
                // Calculate distance for pinch
                const dist = Math.hypot(
                    landmarks[4].x - landmarks[8].x,
                    landmarks[4].y - landmarks[8].y
                );
                
                currentPinch = dist < PINCH_THRESHOLD;
                pinchCursor.x = (thumbTip.x + indexTip.x) / 2;
                pinchCursor.y = (thumbTip.y + indexTip.y) / 2;

                // Draw hand landmarks
                // We must flip X manually for drawing since we already restored the context
                const flippedLandmarks = landmarks.map(lm => ({ x: 1 - lm.x, y: lm.y, z: lm.z }));
                
                drawConnectors(canvasCtx, flippedLandmarks, HAND_CONNECTIONS, {color: 'rgba(255,255,255,0.5)', lineWidth: 3});
                drawLandmarks(canvasCtx, flippedLandmarks, {color: '#ccff00', lineWidth: 1, radius: 3});
            }

            // 3. Game State Updates based on Hand
            if (state === GAME_STATE.INIT) {
                // Draw Capture Box
                canvasCtx.strokeStyle = '#ccff00';
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeRect(puzzleStartX, puzzleStartY, PUZZLE_SIZE, PUZZLE_SIZE);
                
                // Draw text
                canvasCtx.fillStyle = '#ccff00';
                canvasCtx.font = '20px "Share Tech Mono"';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText('JUNTE OS DEDOS AQUI', canvasWidth/2, puzzleStartY - 20);
                canvasCtx.fillText('PARA CAPTURAR', canvasWidth/2, puzzleStartY + PUZZLE_SIZE + 30);

                if (currentPinch && !isPinching) {
                    // Pinch started, check if inside box (or just allow any pinch to start)
                    if (pinchCursor.x > puzzleStartX && pinchCursor.x < puzzleStartX + PUZZLE_SIZE &&
                        pinchCursor.y > puzzleStartY && pinchCursor.y < puzzleStartY + PUZZLE_SIZE) {
                        captureAndScramble();
                    }
                }
            } 
            else if (state === GAME_STATE.PLAYING) {
                // Logic for dragging tiles
                if (currentPinch && !isPinching) {
                    // Just Pinched: Find tile under cursor
                    // Search in reverse to grab top-most tile if overlapping
                    for (let i = tiles.length - 1; i >= 0; i--) {
                        const tile = tiles[i];
                        if (pinchCursor.x >= tile.x && pinchCursor.x <= tile.x + TILE_SIZE &&
                            pinchCursor.y >= tile.y && pinchCursor.y <= tile.y + TILE_SIZE) {
                            grabbedTile = tile;
                            grabOffset.x = pinchCursor.x - tile.x;
                            grabOffset.y = pinchCursor.y - tile.y;
                            
                            // Move grabbed tile to end of array so it renders on top
                            tiles.splice(i, 1);
                            tiles.push(grabbedTile);
                            break;
                        }
                    }
                } else if (currentPinch && isPinching && grabbedTile) {
                    // Dragging
                    grabbedTile.x = pinchCursor.x - grabOffset.x;
                    grabbedTile.y = pinchCursor.y - grabOffset.y;
                } else if (!currentPinch && isPinching && grabbedTile) {
                    // Released: Snap and swap
                    const dropCenter = {
                        x: grabbedTile.x + TILE_SIZE / 2,
                        y: grabbedTile.y + TILE_SIZE / 2
                    };

                    // Find which grid cell we dropped into
                    const targetCol = Math.floor((dropCenter.x - puzzleStartX) / TILE_SIZE);
                    const targetRow = Math.floor((dropCenter.y - puzzleStartY) / TILE_SIZE);

                    if (targetCol >= 0 && targetCol < GRID_SIZE && targetRow >= 0 && targetRow < GRID_SIZE) {
                        // Find the tile currently in that cell and swap
                        const targetTile = tiles.find(t => t.currentRow === targetRow && t.currentCol === targetCol && t !== grabbedTile);
                        
                        if (targetTile) {
                            // Swap grid positions
                            targetTile.currentRow = grabbedTile.currentRow;
                            targetTile.currentCol = grabbedTile.currentCol;
                            
                            grabbedTile.currentRow = targetRow;
                            grabbedTile.currentCol = targetCol;
                        }
                    }
                    
                    grabbedTile = null;
                    checkWin();
                }

                // Draw and update tiles
                tiles.forEach(tile => {
                    tile.updatePosition();
                    tile.draw(canvasCtx);
                });

                // Draw Grid Overlay
                canvasCtx.strokeStyle = 'rgba(204, 255, 0, 0.3)';
                canvasCtx.lineWidth = 1;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    // Vertical lines
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(puzzleStartX + i * TILE_SIZE, puzzleStartY);
                    canvasCtx.lineTo(puzzleStartX + i * TILE_SIZE, puzzleStartY + PUZZLE_SIZE);
                    canvasCtx.stroke();
                    // Horizontal lines
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(puzzleStartX, puzzleStartY + i * TILE_SIZE);
                    canvasCtx.lineTo(puzzleStartX + PUZZLE_SIZE, puzzleStartY + i * TILE_SIZE);
                    canvasCtx.stroke();
                }
            }

            // Draw Cursor feedback (Yellow dot)
            if (handDetected) {
                canvasCtx.fillStyle = currentPinch ? '#ff0000' : '#ccff00';
                canvasCtx.beginPath();
                canvasCtx.arc(pinchCursor.x, pinchCursor.y, currentPinch ? 10 : 6, 0, 2 * Math.PI);
                canvasCtx.fill();
            }

            isPinching = currentPinch;
        }

        // --- MEDIAPIPE INITIALIZATION ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        
        camera.start();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo VR - Interação com o Olhar</title>
    <!-- Importando a biblioteca A-Frame para WebVR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
    <script>
        // Componente customizado para gerenciar a interação com a árvore
        AFRAME.registerComponent('interacao-arvore', {
            init: function () {
                let el = this.el; // O elemento da árvore
                let luzAmbiente = document.querySelector('#luz-ambiente');
                let painelInfo = document.querySelector('#painel-info');
                let copaArvore = document.querySelector('#copa-arvore');
                
                // Evento disparado quando o cursor (olhar) entra no elemento
                el.addEventListener('mouseenter', function () {
                    // 1. Escurece o ambiente
                    luzAmbiente.setAttribute('animation', 'property: light.intensity; to: 0.2; dur: 500; easing: easeOutQuad');
                    
                    // 2. Destaca a árvore (efeito emissivo)
                    copaArvore.setAttribute('animation__cor', 'property: material.emissive; to: #2e8b57; dur: 500');
                    copaArvore.setAttribute('animation__escala', 'property: scale; to: 1.05 1.05 1.05; dur: 500');
                    
                    // 3. Mostra o painel com os cálculos
                    painelInfo.setAttribute('visible', 'true');
                    painelInfo.setAttribute('animation', 'property: material.opacity; from: 0; to: 0.85; dur: 500');
                    // Anima o texto para aparecer
                    let textos = painelInfo.querySelectorAll('a-text');
                    textos.forEach(t => t.setAttribute('animation', 'property: opacity; from: 0; to: 1; dur: 500'));
                });

                // Evento disparado quando o cursor (olhar) sai do elemento
                el.addEventListener('mouseleave', function () {
                    // 1. Clareia o ambiente de volta ao normal
                    luzAmbiente.setAttribute('animation', 'property: light.intensity; to: 1.2; dur: 500; easing: easeOutQuad');
                    
                    // 2. Remove o destaque da árvore
                    copaArvore.setAttribute('animation__cor', 'property: material.emissive; to: #000000; dur: 500');
                    copaArvore.setAttribute('animation__escala', 'property: scale; to: 1 1 1; dur: 500');
                    
                    // 3. Esconde o painel
                    painelInfo.setAttribute('visible', 'false');
                });
            }
        });
    </script>
</head>
<body>
    <!-- Cena principal do A-Frame -->
    <a-scene background="color: #87CEEB">
        <!-- Gerenciamento de Assets (Texturas poderiam ir aqui) -->
        <a-assets>
            <a-mixin id="texto-padrao" color="#FFFFFF" align="left" baseline="top"></a-mixin>
        </a-assets>

        <!-- Iluminação -->
        <a-light id="luz-ambiente" type="ambient" color="#FFF" intensity="1.2"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="0.5" castShadow="true"></a-light>

        <!-- Câmera com Cursor Baseado no Olhar (Gaze) -->
        <a-entity position="0 1.6 5">
            <a-camera look-controls wasd-controls>
                <!-- O cursor circular no centro da tela -->
                <a-entity cursor="fuse: true; fuseTimeout: 100"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: white; shader: flat; opacity: 0.8"
                          raycaster="objects: .interativo"
                          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 100; from: 1 1 1; to: 0.5 0.5 0.5"
                          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 100; to: 1 1 1">
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- CENÁRIO BASE -->
        <!-- Calçadão (Chão) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="15" color="#D2B48C"></a-plane>
        <!-- Rio / Água -->
        <a-plane position="25 0 0" rotation="-90 0 0" width="30" height="30" color="#4682B4" material="opacity: 0.8; transparent: true"></a-plane>
        <!-- Píer de madeira simples (referência da foto) -->
        <a-box position="12 0.5 2" width="5" height="0.2" depth="15" color="#8B4513"></a-box>

        <!-- ENTIDADE PRINCIPAL: A ÁRVORE (Com classe 'interativo' para o raycaster) -->
        <a-entity position="-3 0 0" class="interativo" interacao-arvore>
            
            <!-- Tronco: Cilindro -->
            <a-cylinder position="0 1 0" radius="0.4" height="2" color="#5C4033"></a-cylinder>
            
            <!-- Copa: Esfera (O alvo principal do olhar) -->
            <a-sphere id="copa-arvore" position="0 4 0" radius="3" color="#228B22" material="roughness: 0.8"></a-sphere>

            <!-- PAINEL DE INFORMAÇÕES (Oculto por padrão) -->
            <a-entity id="painel-info" position="4.5 4 0" rotation="0 -15 0" visible="false">
                <!-- Fundo do painel -->
                <a-plane width="5.5" height="3.5" color="#000000" material="opacity: 0.8; transparent: true"></a-plane>
                
                <!-- Textos e Cálculos -->
                <a-text value="ANALISE BOTANICA E GEOMETRICA" position="-2.5 1.4 0.01" color="#FFD700" width="6" font="mozillavr"></a-text>
                
                <a-text value="Forma de Representacao:" position="-2.5 0.9 0.01" width="5" mixin="texto-padrao"></a-text>
                <a-text value="Esfera (Copa) sobre Cilindro (Tronco)" position="-2.5 0.6 0.01" width="5" color="#ADD8E6"></a-text>
                
                <a-text value="Medidas Capturadas (Ficticias):" position="-2.5 0.1 0.01" width="5" mixin="texto-padrao"></a-text>
                <a-text value="- Raio da Copa (r): 3.0 metros\n- Altura visivel do Tronco (t): 1.0 metro" position="-2.5 -0.2 0.01" width="5" color="#ADD8E6"></a-text>
                
                <a-text value="Calculo da Altura Total (H):" position="-2.5 -0.8 0.01" width="5" mixin="texto-padrao"></a-text>
                <a-text value="H = t + (r * 2)" position="-2.5 -1.1 0.01" width="5" color="#90EE90"></a-text>
                <a-text value="H = 1.0 + (3.0 * 2) = 7.0 metros" position="-2.5 -1.4 0.01" width="5" color="#90EE90" font="mozillavr"></a-text>
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>

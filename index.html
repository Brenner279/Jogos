<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Matemático</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte do Google Fonts para um visual mais moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>Desafio Matemático 🧮</h1>
        
        <div class="score-board">
            <p>Pontos: <span id="score">0</span></p>
        </div>

        <div class="problem-area">
            <span id="num1">0</span>
            <span id="operator">+</span>
            <span id="num2">0</span>
            <span>=</span>
            <input type="number" id="answer" autocomplete="off" autofocus placeholder="?">
        </div>

        <button id="submit-btn">Responder</button>
        
        <div id="message" class="message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

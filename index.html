<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Math Quiz: Área de Figuras Planas</title>
    <!-- Importando o A-Frame para Realidade Virtual -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        /* Uma tela de loading simples para navegadores mais lentos */
        #loading {
            position: absolute; width: 100%; height: 100%; background: #333; color: white;
            display: flex; justify-content: center; align-items: center; z-index: 9999; font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading">Carregando Mundo VR...</div>

    <a-scene background="color: #5C94FC"> <!-- Cor de fundo estilo céu de jogo clássico -->
        
        <!-- ASSETS (Materiais, texturas) -->
        <a-assets>
            <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
            <img id="brickTexture" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/cubes.jpg" crossorigin="anonymous">
            
            <!-- Mixin para os blocos de resposta para reaproveitar código -->
            <a-mixin id="answer-box" geometry="primitive: box; width: 1.5; height: 1.5; depth: 1.5"
                     material="src: #brickTexture; color: #F0A000"
                     animation__hover="property: position; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true"></a-mixin>
        </a-assets>

        <!-- AMBIENTE (Chão) -->
        <a-plane src="#groundTexture" rotation="-90 0 0" width="100" height="100" repeat="100 100" material="color: #7EC020"></a-plane>

        <!-- JOGADOR E CÂMERA -->
        <a-entity position="0 1.6 0"> <!-- Altura média de uma pessoa -->
            <a-camera look-controls wasd-controls="enabled: false">
                <!-- Cursor para interação (funciona no PC clicando e no VR olhando/gatilho) -->
                <a-cursor color="#FF0000" 
                          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                          animation__fusing="property: fusing; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
                </a-cursor>
                
                <!-- Feedback visual na tela (Acerto/Erro) -->
                <a-plane id="screen-flash" position="0 0 -0.5" width="2" height="2" material="color: white; opacity: 0; transparent: true"></a-plane>
            </a-camera>
        </a-entity>

        <!-- INTERFACE DO JOGO (HUD) -->
        <!-- Vidas e Pontuação -->
        <a-text id="hud-lives" value="Vidas: 3" position="-3 4 -5" color="#FF0000" scale="1.5 1.5 1.5" font="mozillavr"></a-text>
        <a-text id="hud-score" value="Nivel: 1/5" position="1.5 4 -5" color="#FFFF00" scale="1.5 1.5 1.5" font="mozillavr"></a-text>

        <!-- Pergunta -->
        <a-entity id="question-container" position="0 3 -5">
            <a-text id="question-text" value="Carregando..." align="center" color="#FFFFFF" scale="2 2 2" font="mozillavr"></a-text>
        </a-entity>

        <!-- BLOCOS DE RESPOSTA -->
        <!-- Bloco A (Esquerda) -->
        <a-entity class="clickable" id="box-0" mixin="answer-box" position="-2.5 1 -4" animation__hover="to: -2.5 1.2 -4">
            <a-text id="text-0" value="A" align="center" position="0 0 0.8" scale="2 2 2" color="#FFFFFF"></a-text>
        </a-entity>

        <!-- Bloco B (Centro) -->
        <a-entity class="clickable" id="box-1" mixin="answer-box" position="0 1 -4" animation__hover="to: 0 1.2 -4">
            <a-text id="text-1" value="B" align="center" position="0 0 0.8" scale="2 2 2" color="#FFFFFF"></a-text>
        </a-entity>

        <!-- Bloco C (Direita) -->
        <a-entity class="clickable" id="box-2" mixin="answer-box" position="2.5 1 -4" animation__hover="to: 2.5 1.2 -4">
            <a-text id="text-2" value="C" align="center" position="0 0 0.8" scale="2 2 2" color="#FFFFFF"></a-text>
        </a-entity>

    </a-scene>

    <script>
        // Esconde a tela de loading quando a cena carregar
        document.querySelector('a-scene').addEventListener('loaded', function () {
            document.getElementById('loading').style.display = 'none';
            startGame();
        });

        // BANCO DE QUESTÕES (Área de Figuras Planas)
        const questions = [
            {
                text: "Qual a area de um QUADRADO\ncom lado de 5 metros?",
                answers: ["20 m2", "25 m2", "10 m2"],
                correct: 1 // Índice da resposta correta (0, 1 ou 2)
            },
            {
                text: "Calcule a area do RETANGULO:\nBase = 6m, Altura = 3m",
                answers: ["18 m2", "9 m2", "12 m2"],
                correct: 0
            },
            {
                text: "Um TRIANGULO tem base de 4m\ne altura de 5m. Qual a area?",
                answers: ["20 m2", "10 m2", "9 m2"],
                correct: 1
            },
            {
                text: "Area do LOSANGO com diagonais\nmaior = 8m e menor = 4m:",
                answers: ["32 m2", "12 m2", "16 m2"],
                correct: 2
            },
            {
                text: "Area de um TRAPEZIO:\nB=6m, b=4m, altura=3m",
                answers: ["15 m2", "30 m2", "13 m2"],
                correct: 0
            }
        ];

        // VARIÁVEIS DE ESTADO DO JOGO
        let currentQuestionIndex = 0;
        let lives = 3;
        let isGameOver = false;

        // ELEMENTOS DO DOM A-FRAME
        const elQuestionText = document.getElementById('question-text');
        const elHudLives = document.getElementById('hud-lives');
        const elHudScore = document.getElementById('hud-score');
        const elScreenFlash = document.getElementById('screen-flash');
        
        const boxes = [
            document.getElementById('box-0'),
            document.getElementById('box-1'),
            document.getElementById('box-2')
        ];
        const texts = [
            document.getElementById('text-0'),
            document.getElementById('text-1'),
            document.getElementById('text-2')
        ];

        // FUNÇÃO PARA INICIAR/REINICIAR O JOGO
        function startGame() {
            currentQuestionIndex = 0;
            lives = 3;
            isGameOver = false;
            updateHUD();
            loadQuestion();
            
            // Reabilita os blocos
            boxes.forEach(box => box.setAttribute('visible', 'true'));
        }

        // FUNÇÃO PARA CARREGAR A PERGUNTA ATUAL
        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                victory();
                return;
            }

            const q = questions[currentQuestionIndex];
            elQuestionText.setAttribute('value', q.text);
            
            for (let i = 0; i < 3; i++) {
                texts[i].setAttribute('value', q.answers[i]);
                // Reseta a cor dos blocos para o padrão
                boxes[i].setAttribute('material', 'color', '#F0A000');
            }
            updateHUD();
        }

        // ATUALIZA TEXTOS DE VIDAS E NÍVEL
        function updateHUD() {
            elHudLives.setAttribute('value', 'Vidas: ' + lives);
            let heartColor = lives > 1 ? '#FF0000' : '#FFAAAA'; // Fica pálido se tiver 1 vida
            elHudLives.setAttribute('color', heartColor);
            
            if(!isGameOver) {
                elHudScore.setAttribute('value', 'Nivel: ' + (currentQuestionIndex + 1) + '/' + questions.length);
            }
        }

        // EFEITO DE PISCAR A TELA (Verde = Acerto, Vermelho = Erro)
        function flashScreen(color) {
            elScreenFlash.setAttribute('material', 'color', color);
            elScreenFlash.setAttribute('animation', 'property: material.opacity; from: 0.8; to: 0; dur: 500; easing: easeOutQuad');
        }

        // LÓGICA DE VERIFICAÇÃO DA RESPOSTA
        function handleAnswer(selectedIndex) {
            if (isGameOver) {
                // Se o jogo acabou e clicou de novo, reinicia
                startGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            if (selectedIndex === q.correct) {
                // ACERTOU
                flashScreen('#00FF00'); // Pisca verde
                boxes[selectedIndex].setAttribute('material', 'color', '#00FF00');
                
                // Aguarda 1 segundo e avança
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000);

            } else {
                // ERROU
                flashScreen('#FF0000'); // Pisca vermelho
                boxes[selectedIndex].setAttribute('material', 'color', '#FF0000'); // Bloco fica vermelho
                lives--;
                updateHUD();

                if (lives <= 0) {
                    gameOver();
                } else {
                    // Treme o texto da pergunta para indicar erro
                    elQuestionText.setAttribute('animation__error', 'property: position; from: -0.1 3 -5; to: 0.1 3 -5; dur: 50; dir: alternate; loop: 5');
                    setTimeout(() => {
                        elQuestionText.removeAttribute('animation__error');
                        elQuestionText.setAttribute('position', '0 3 -5');
                        boxes[selectedIndex].setAttribute('material', 'color', '#F0A000'); // Restaura a cor
                    }, 500);
                }
            }
        }

        // FUNÇÃO DE DERROTA
        function gameOver() {
            isGameOver = true;
            elQuestionText.setAttribute('value', 'GAME OVER!\nVoce perdeu todas as vidas.\nClique em qualquer bloco para reiniciar.');
            elHudScore.setAttribute('value', '');
            boxes.forEach(box => {
                box.setAttribute('material', 'color', '#333333');
                box.querySelector('a-text').setAttribute('value', 'TENTAR\nNOVAMENTE');
            });
        }

        // FUNÇÃO DE VITÓRIA
        function victory() {
            isGameOver = true;
            flashScreen('#FFFF00');
            elQuestionText.setAttribute('value', 'PARABENS!\nVoce concluiu todos os niveis!\nClique para jogar de novo.');
            elHudScore.setAttribute('value', 'VENCEDOR!');
            boxes.forEach(box => {
                box.setAttribute('material', 'color', '#00FF00');
                box.querySelector('a-text').setAttribute('value', 'JOGAR\nNOVAMENTE');
            });
        }

        // ADICIONANDO EVENTOS DE CLIQUE/GAZE NOS BLOCOS
        boxes.forEach((box, index) => {
            box.addEventListener('click', function () {
                handleAnswer(index);
            });
            
            // Efeito visual ao mirar no bloco
            box.addEventListener('mouseenter', function () {
                if(!isGameOver) box.setAttribute('material', 'color', '#FFD700'); // Fica dourado
            });
            box.addEventListener('mouseleave', function () {
                 if(!isGameOver) box.setAttribute('material', 'color', '#F0A000'); // Volta ao normal
            });
        });

    </script>
</body>
</html>

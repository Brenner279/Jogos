<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desenhe Geometria no Ar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #0f172a; /* Lousa / Slate */
            color: white; 
            font-family: 'Inter', sans-serif;
            /* Padrão de Grade (Blueprint/Quadro Escolar) */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
        }

        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.6);
        }
        
        .math-block {
            font-family: 'Fira Code', monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        #camera-view {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 200px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(56, 189, 248, 0.3);
            z-index: 20;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: scaleX(-1);
        }
        #camera-canvas { width: 100%; height: 100%; object-fit: cover; }

        /* Status Badges */
        .status-badge { transition: all 0.3s ease; }
        .status-draw { background-color: #0ea5e9; color: white; box-shadow: 0 0 15px #0ea5e988; }
        .status-analyze { background-color: #10b981; color: white; box-shadow: 0 0 15px #10b98188; }
        .status-clear { background-color: #ef4444; color: white; box-shadow: 0 0 15px #ef444488; }
        .status-idle { background-color: rgba(255,255,255,0.1); color: #94a3b8; }
    </style>
</head>
<body class="antialiased">

    <!-- Canvas principal de desenho -->
    <canvas id="drawing-canvas"></canvas>

    <!-- PIP da Câmera -->
    <div id="camera-view" class="pointer-events-auto">
        <video id="input_video" style="display:none;"></video>
        <canvas id="camera-canvas" width="320" height="240"></canvas>
    </div>

    <!-- Interface Gráfica -->
    <div class="ui-layer flex flex-col md:flex-row h-screen w-screen p-6 justify-between gap-6">
        
        <!-- Painel de Instruções (Esquerda/Topo) -->
        <div class="glass-panel pointer-events-auto w-full md:w-80 rounded-2xl p-6 flex flex-col gap-5 max-h-min self-start">
            <div>
                <h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent mb-1">Geometria no Ar</h1>
                <p class="text-sm text-slate-400">O seu dedo é o lápis virtual.</p>
            </div>

            <div class="space-y-4">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Gestos</h3>
                
                <div class="flex items-center gap-3 bg-white/5 p-3 rounded-lg border border-white/5">
                    <span class="text-2xl">☝️</span>
                    <div>
                        <p class="text-sm font-bold text-sky-400">Desenhar</p>
                        <p class="text-xs text-slate-400">Só o indicador esticado</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 bg-white/5 p-3 rounded-lg border border-white/5">
                    <span class="text-2xl">🖐️</span>
                    <div>
                        <p class="text-sm font-bold text-emerald-400">Analisar Forma</p>
                        <p class="text-xs text-slate-400">Mão totalmente aberta</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 bg-white/5 p-3 rounded-lg border border-white/5">
                    <span class="text-2xl">✊</span>
                    <div>
                        <p class="text-sm font-bold text-red-400">Apagar Quadro</p>
                        <p class="text-xs text-slate-400">Mão fechada (Punho)</p>
                    </div>
                </div>
            </div>

            <div class="mt-4 flex justify-center">
                <div id="gesture-status" class="status-badge status-idle px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2">
                    <div id="gesture-dot" class="w-2 h-2 rounded-full bg-current opacity-50"></div>
                    <span id="gesture-text">Aguardando Mão...</span>
                </div>
            </div>
        </div>

        <!-- Painel de Resultados (Direita) -->
        <div id="result-panel" class="glass-panel pointer-events-auto w-full md:w-[400px] rounded-2xl p-6 flex flex-col gap-6 self-start transform transition-all duration-500 opacity-0 translate-x-10 hidden">
            
            <div class="border-b border-slate-700 pb-3 flex justify-between items-end">
                <h2 id="shape-name" class="text-2xl font-black text-white uppercase tracking-wide">Triângulo</h2>
                <span class="text-xs font-bold px-2 py-1 bg-emerald-500/20 text-emerald-400 rounded">Detetado</span>
            </div>

            <div id="shape-icon" class="flex justify-center py-4 text-emerald-400">
                <!-- Ícone SVG injetado via JS -->
            </div>

            <div class="space-y-4">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Medidas Simuladas</h3>
                    <div id="measurements" class="grid grid-cols-2 gap-3">
                        <!-- Medidas injetadas aqui -->
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Fórmula da Área</h3>
                    <div id="formula-display" class="math-block text-sky-300">
                        A = (b &times; h) / 2
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Cálculo Passo a Passo</h3>
                    <div id="calculation-steps" class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 text-sm space-y-2 text-slate-300">
                        <!-- Passos injetados aqui -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // ESTADO DA APLICAÇÃO
        // ==========================================
        const state = {
            stroke: [],           // Pontos do desenho atual
            isDrawing: false,
            mode: 'IDLE',         // IDLE, DRAW, ANALYZE
            lastProcessedTime: 0,
            pixelsPerMeter: 150   // Fator de escala visual (150px = 1 metro)
        };

        // Elementos do DOM
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const resultPanel = document.getElementById('result-panel');
        const statusBadge = document.getElementById('gesture-status');
        const statusText = document.getElementById('gesture-text');

        // Ajustar Canvas à janela
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // ALGORITMOS DE GEOMETRIA & RECONHECIMENTO
        // ==========================================

        // Distância Euclidiana
        const dist = (p1, p2) => Math.sqrt((p2.x - p1.x)**2 + (p2.y - p1.y)**2);

        // Simplificação de Polígonos (Douglas-Peucker) - Reduz ruído do traço à mão
        function douglasPeucker(points, epsilon) {
            if (points.length <= 2) return points;
            let dmax = 0;
            let index = 0;
            const end = points.length - 1;
            
            for (let i = 1; i < end; i++) {
                const d = perpendicularDistance(points[i], points[0], points[end]);
                if (d > dmax) { index = i; dmax = d; }
            }
            
            if (dmax > epsilon) {
                const left = douglasPeucker(points.slice(0, index + 1), epsilon);
                const right = douglasPeucker(points.slice(index), epsilon);
                return left.slice(0, left.length - 1).concat(right);
            } else {
                return [points[0], points[end]];
            }
        }

        function perpendicularDistance(pt, lineStart, lineEnd) {
            const dx = lineEnd.x - lineStart.x;
            const dy = lineEnd.y - lineStart.y;
            const mag = Math.sqrt(dx*dx + dy*dy);
            if(mag === 0) return dist(pt, lineStart);
            return Math.abs(dx * (lineStart.y - pt.y) - (lineStart.x - pt.x) * dy) / mag;
        }

        // Análise de Forma
        function analyzeShape(points) {
            if (points.length < 10) return null; // Traço muito curto

            // 1. Calcular Bounding Box (Caixa Delimitadora)
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            });

            const width = maxX - minX;
            const height = maxY - minY;
            const centerX = minX + width / 2;
            const centerY = minY + height / 2;
            
            // Rejeitar pontos num só lugar
            if(width < 20 && height < 20) return null;

            // Fechar o polígono para a análise
            const closedPoints = [...points, points[0]];

            // 2. Verificar Circularidade (se a distância ao centro é constante)
            const radiusAvg = (width + height) / 4;
            let variance = 0;
            points.forEach(p => {
                const d = dist(p, {x: centerX, y: centerY});
                variance += Math.abs(d - radiusAvg);
            });
            const avgVariance = variance / points.length;
            const isCircle = avgVariance < (radiusAvg * 0.25); // Tolerância de 25% na variação

            if (isCircle && width > 40 && height > 40) {
                return { type: 'Círculo', r: radiusAvg, cx: centerX, cy: centerY };
            }

            // 3. Simplificar Polígono para contar os cantos
            const epsilon = Math.max(width, height) * 0.12; // Sensibilidade dos cantos
            const corners = douglasPeucker(closedPoints, epsilon);
            const numCorners = corners.length - 1; // O primeiro e último são o mesmo

            // 4. Classificação Heurística baseada em cantos
            if (numCorners === 3) {
                // Triângulo
                return { type: 'Triângulo', w: width, h: height, minX, minY };
            } 
            else if (numCorners === 4) {
                const aspect = width / height;
                
                // Extrair pontos ordenados por Y
                const sortedY = [...corners.slice(0, 4)].sort((a,b) => a.y - b.y);
                const top2 = sortedY.slice(0, 2).sort((a,b) => a.x - b.x);
                const bottom2 = sortedY.slice(2, 4).sort((a,b) => a.x - b.x);
                
                const topWidth = dist(top2[0], top2[1]);
                const bottomWidth = dist(bottom2[0], bottom2[1]);

                // Losango? (Se desenhado como diamante: cantos no topo-centro, baixo-centro, esq, dir)
                // Se a distância entre topos for muito pequena, é um vértice.
                if (topWidth < width * 0.3 && bottomWidth < width * 0.3) {
                    return { type: 'Losango', D: Math.max(width, height), d: Math.min(width, height) };
                }

                // Trapézio? (Se a largura superior e inferior forem muito diferentes)
                if (Math.abs(topWidth - bottomWidth) > width * 0.2) {
                    return { type: 'Trapézio', B: Math.max(topWidth, bottomWidth), b: Math.min(topWidth, bottomWidth), h: height };
                }

                // Quadrado ou Retângulo?
                if (aspect > 0.8 && aspect < 1.25) {
                    const l = (width + height) / 2;
                    return { type: 'Quadrado', l: l };
                } else {
                    return { type: 'Retângulo', b: width, h: height };
                }
            } 
            else {
                // Polígono complexo desenhado à mão. Vamos forçar um palpite educacional.
                const aspect = width / height;
                if(avgVariance < radiusAvg * 0.35) return { type: 'Círculo', r: radiusAvg, cx: centerX, cy: centerY };
                if (aspect > 0.8 && aspect < 1.2) return { type: 'Quadrado', l: (width+height)/2 };
                return { type: 'Retângulo', b: width, h: height };
            }
        }

        // ==========================================
        // RENDERIZAÇÃO DA UI & RESULTADOS
        // ==========================================
        
        function formatM(px) {
            return (px / state.pixelsPerMeter).toFixed(1);
        }

        function showResult(shapeData) {
            resultPanel.classList.remove('hidden');
            // Timeout pequeno para animação do Tailwind funcionar
            setTimeout(() => {
                resultPanel.classList.remove('opacity-0', 'translate-x-10');
            }, 10);

            const nameEl = document.getElementById('shape-name');
            const iconEl = document.getElementById('shape-icon');
            const measEl = document.getElementById('measurements');
            const formulaEl = document.getElementById('formula-display');
            const stepsEl = document.getElementById('calculation-steps');

            nameEl.innerText = shapeData.type;
            measEl.innerHTML = ''; // Limpar anterior
            
            // Helper para adicionar medida na UI
            const addMeasure = (label, val, unit="m") => {
                measEl.innerHTML += `
                    <div class="bg-slate-800/80 p-2 rounded border border-slate-700 text-center">
                        <span class="block text-[10px] text-slate-400 uppercase">${label}</span>
                        <span class="text-lg font-bold text-white">${val} <span class="text-sm text-sky-400">${unit}</span></span>
                    </div>`;
            };

            // Ícones SVG básicos
            const svgs = {
                'Triângulo': `<svg width="80" height="80" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="none" stroke="currentColor" stroke-width="4"/></svg>`,
                'Quadrado': `<svg width="80" height="80" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="none" stroke="currentColor" stroke-width="4"/></svg>`,
                'Retângulo': `<svg width="80" height="80" viewBox="0 0 100 100"><rect x="10" y="30" width="80" height="40" fill="none" stroke="currentColor" stroke-width="4"/></svg>`,
                'Círculo': `<svg width="80" height="80" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4"/></svg>`,
                'Trapézio': `<svg width="80" height="80" viewBox="0 0 100 100"><polygon points="30,20 70,20 90,80 10,80" fill="none" stroke="currentColor" stroke-width="4"/></svg>`,
                'Losango': `<svg width="80" height="80" viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="currentColor" stroke-width="4"/></svg>`
            };
            iconEl.innerHTML = svgs[shapeData.type];

            // Injetar lógicas matemáticas consoante a forma
            let resultArea = 0;
            if (shapeData.type === 'Triângulo') {
                const b = formatM(shapeData.w);
                const h = formatM(shapeData.h);
                addMeasure("Base (b)", b); addMeasure("Altura (h)", h);
                formulaEl.innerHTML = "A = <span class='text-white'>(b &times; h) / 2</span>";
                resultArea = (b * h) / 2;
                stepsEl.innerHTML = `
                    <p>1. Multiplicamos a base pela altura: <br><span class="text-sky-300 font-mono">${b} &times; ${h} = ${(b*h).toFixed(2)}</span></p>
                    <p>2. Dividimos o resultado por 2 (pois o triângulo é metade de um retângulo): <br><span class="text-sky-300 font-mono">${(b*h).toFixed(2)} / 2 = ${resultArea.toFixed(2)} m&sup2;</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            } 
            else if (shapeData.type === 'Quadrado') {
                const l = formatM(shapeData.l);
                addMeasure("Lado (l)", l);
                formulaEl.innerHTML = "A = <span class='text-white'>l&sup2;</span> (ou l &times; l)";
                resultArea = l * l;
                stepsEl.innerHTML = `
                    <p>1. O quadrado tem lados iguais. Elevamos o lado ao quadrado: <br><span class="text-sky-300 font-mono">${l} &times; ${l}</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            }
            else if (shapeData.type === 'Retângulo') {
                const b = formatM(shapeData.b);
                const h = formatM(shapeData.h);
                addMeasure("Base (b)", b); addMeasure("Altura (h)", h);
                formulaEl.innerHTML = "A = <span class='text-white'>b &times; h</span>";
                resultArea = b * h;
                stepsEl.innerHTML = `
                    <p>1. Multiplicamos o comprimento da base pela altura: <br><span class="text-sky-300 font-mono">${b} &times; ${h}</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            }
            else if (shapeData.type === 'Círculo') {
                const r = formatM(shapeData.r);
                addMeasure("Raio (r)", r);
                formulaEl.innerHTML = "A = <span class='text-white'>&pi; &times; r&sup2;</span>";
                resultArea = Math.PI * (r * r);
                stepsEl.innerHTML = `
                    <p>1. Consideramos &pi; (Pi) como aprox. 3.14159.</p>
                    <p>2. Calculamos o raio ao quadrado: <br><span class="text-sky-300 font-mono">${r}&sup2; = ${(r*r).toFixed(2)}</span></p>
                    <p>3. Multiplicamos por &pi;: <br><span class="text-sky-300 font-mono">3.14159 &times; ${(r*r).toFixed(2)}</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            }
            else if (shapeData.type === 'Trapézio') {
                const B = formatM(shapeData.B);
                const b = formatM(shapeData.b);
                const h = formatM(shapeData.h);
                addMeasure("Base Maior (B)", B); addMeasure("Base Menor (b)", b); addMeasure("Altura", h);
                formulaEl.innerHTML = "A = <span class='text-white'>(B + b) &times; h / 2</span>";
                const sum = parseFloat(B) + parseFloat(b);
                resultArea = (sum * h) / 2;
                stepsEl.innerHTML = `
                    <p>1. Somamos as duas bases (Maior e Menor): <br><span class="text-sky-300 font-mono">${B} + ${b} = ${sum.toFixed(2)}</span></p>
                    <p>2. Multiplicamos pela altura: <br><span class="text-sky-300 font-mono">${sum.toFixed(2)} &times; ${h} = ${(sum*h).toFixed(2)}</span></p>
                    <p>3. Dividimos por 2: <br><span class="text-sky-300 font-mono">${(sum*h).toFixed(2)} / 2</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            }
            else if (shapeData.type === 'Losango') {
                const D = formatM(shapeData.D);
                const d = formatM(shapeData.d);
                addMeasure("Diag. Maior (D)", D); addMeasure("Diag. Menor (d)", d);
                formulaEl.innerHTML = "A = <span class='text-white'>(D &times; d) / 2</span>";
                resultArea = (D * d) / 2;
                stepsEl.innerHTML = `
                    <p>1. Multiplicamos as duas diagonais: <br><span class="text-sky-300 font-mono">${D} &times; ${d} = ${(D*d).toFixed(2)}</span></p>
                    <p>2. Dividimos por 2 (o losango ocupa metade do retângulo que o envolve): <br><span class="text-sky-300 font-mono">${(D*d).toFixed(2)} / 2</span></p>
                    <p class="font-bold text-emerald-400 mt-2 text-base border-t border-slate-700 pt-2">Área Total = ${resultArea.toFixed(2)} m&sup2;</p>
                `;
            }

            // Desenhar o contorno geométrico perfeito por cima do desenho do utilizador
            drawPerfectShape(shapeData);
        }

        function drawPerfectShape(shape) {
            ctx.strokeStyle = '#10b981'; // Emerald
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 10]); // Tracejado
            ctx.beginPath();

            const c = { x: canvas.width/2, y: canvas.height/2 }; // Simplificação: desenhar no centro se não houver coordenadas exatas guardadas fáceis

            // Recorrer ao bounding box original se guardado, ou desenhar ao centro
            if (shape.type === 'Triângulo' || shape.type === 'Retângulo' || shape.type === 'Quadrado') {
                // ... Simplificação para o CodePen. O desenho ideal é ilustrativo.
                // Para não complicar demasiado a sobreposição exata, deixamos o traço 
                // à mão no ecrã e mostramos o ícone na UI. O utilizador já vê o que desenhou.
            }
            // Retirar tracejado
            ctx.setLineDash([]);
        }

        // ==========================================
        // RENDERIZAÇÃO DO QUADRO E TRAÇO
        // ==========================================
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar traço atual
            if (state.stroke.length > 0) {
                ctx.beginPath();
                ctx.moveTo(state.stroke[0].x, state.stroke[0].y);
                for (let i = 1; i < state.stroke.length; i++) {
                    // Suavizar com curvas bezier na prática seria melhor, mas lineTo funciona para protótipo rápido
                    ctx.lineTo(state.stroke[i].x, state.stroke[i].y);
                }
                ctx.strokeStyle = '#0ea5e9'; // Ciano Sky (Lápis virtual)
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Brilho Neon
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#0ea5e9';
                ctx.stroke();
                
                // Reset sombra
                ctx.shadowBlur = 0;
            }
        }

        function setUIStatus(mode) {
            statusBadge.className = 'status-badge px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2';
            if (mode === 'DRAW') {
                statusBadge.classList.add('status-draw');
                statusText.innerText = "Modo Lápis (Desenhando...)";
            } else if (mode === 'ANALYZE') {
                statusBadge.classList.add('status-analyze');
                statusText.innerText = "Processando Forma...";
            } else if (mode === 'CLEAR') {
                statusBadge.classList.add('status-clear');
                statusText.innerText = "Limpando Quadro!";
            } else {
                statusBadge.classList.add('status-idle');
                statusText.innerText = "Mostre a Mão à Câmera";
            }
        }

        // ==========================================
        // MEDIAPIPE HANDS - GESTOS E RASTREAMENTO
        // ==========================================
        const videoElement = document.getElementById('input_video');
        const cameraCanvas = document.getElementById('camera-canvas');
        const camCtx = cameraCanvas.getContext('2d');

        function onResults(results) {
            // Desenhar PIP
            camCtx.save();
            camCtx.clearRect(0, 0, cameraCanvas.width, cameraCanvas.height);
            camCtx.drawImage(results.image, 0, 0, cameraCanvas.width, cameraCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Desenhar malha da mão no PIP
                drawConnectors(camCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 1});
                drawLandmarks(camCtx, landmarks, {color: '#0ea5e9', lineWidth: 0, radius: 2});

                // Lógica de Gestos
                const isExtended = (tip, pip) => landmarks[tip].y < landmarks[pip].y;
                
                const indexUp = isExtended(8, 6);
                const middleUp = isExtended(12, 10);
                const ringUp = isExtended(16, 14);
                const pinkyUp = isExtended(20, 18);

                let currentGesture = 'IDLE';

                // Lápis (Apenas indicador)
                if (indexUp && !middleUp && !ringUp && !pinkyUp) {
                    currentGesture = 'DRAW';
                }
                // Analisar (Mão Aberta)
                else if (indexUp && middleUp && ringUp && pinkyUp) {
                    currentGesture = 'ANALYZE';
                }
                // Limpar (Mão Fechada)
                else if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
                    currentGesture = 'CLEAR';
                }

                // Converter coordenadas do dedo indicador (Ponto 8)
                // Inverter X porque a webcam está espelhada
                const x = (1 - landmarks[8].x) * canvas.width;
                const y = landmarks[8].y * canvas.height;

                const now = Date.now();

                // Máquina de Estados
                if (currentGesture === 'DRAW') {
                    if (state.mode !== 'DRAW') setUIStatus('DRAW');
                    state.mode = 'DRAW';
                    state.stroke.push({x, y});
                    
                    // Esconder painel de resultado se começar a desenhar de novo
                    resultPanel.classList.add('opacity-0', 'translate-x-10');
                    setTimeout(() => resultPanel.classList.add('hidden'), 500);

                } 
                else if (currentGesture === 'ANALYZE' && state.mode === 'DRAW') {
                    // Só analisa se estava a desenhar antes
                    state.mode = 'ANALYZE';
                    setUIStatus('ANALYZE');
                    
                    const shapeData = analyzeShape(state.stroke);
                    if (shapeData) {
                        showResult(shapeData);
                    } else {
                        // Traço inválido, limpar
                        state.stroke = [];
                        setUIStatus('IDLE');
                    }
                }
                else if (currentGesture === 'CLEAR') {
                    state.mode = 'CLEAR';
                    setUIStatus('CLEAR');
                    state.stroke = [];
                    resultPanel.classList.add('opacity-0', 'translate-x-10');
                    setTimeout(() => resultPanel.classList.add('hidden'), 500);
                }
                else if (currentGesture === 'IDLE' && state.mode !== 'ANALYZE') {
                    state.mode = 'IDLE';
                    setUIStatus('IDLE');
                }

                // Atualizar ecrã
                drawCanvas();

            } else {
                setUIStatus('IDLE');
            }
            camCtx.restore();
        }

        // Iniciar MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        
        camera.start().catch(err => {
            alert("Permita o acesso à câmara para desenhar no ar!");
        });

    </script>
</body>
</html>
